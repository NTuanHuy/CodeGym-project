<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình đơn ngang thả xuống (Horizontal Dropdown Menu)</title>
    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            padding: 20px;
        }

        
        #menu {
            height: 40px;
            background-color: #333333;
            border-bottom: 2px solid #111111;
        }

        #menu ul {
            list-style: none;
        }

        
        #menu > ul > li {
            float: left;
            position: relative;
        }

        /* Định dạng các liên kết trong menu */
        #menu a {
            display: block;
            width: 150px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            background-color: #333333;
        }

     
        #menu li:hover > a {
            background-color: #e74c3c;
        }

     
        #menu ul ul {
            position: absolute;
            top: 40px;
            left: 0;
            visibility: hidden; /* Ẩn menu con mặc định */
        }

       
        #menu ul ul li {
            float: none;
        }

      
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li><a href="#">Trang chủ</a></li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Thiết kế Web</a></li>
                    <li><a href="#">Lập trình App</a></li>
                </ul>
            </li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
    </div>

</body>
</html>
