<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flex-Flow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 18px;
        }

        /* Ví dụ 1: row nowrap */
        .container-1 {
            display: flex;
            flex-flow: row nowrap;
            background-color: #f1f1f1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .container-1 > div {
            background-color: #007bff;
            color: white;
            width: 100px;
            height: 50px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Ví dụ 2: row-reverse nowrap */
        .container-2 {
            display: flex;
            flex-flow: row-reverse nowrap;
            background-color: #f1f1f1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .container-2 > div {
            background-color: #28a745;
            color: white;
            width: 100px;
            height: 50px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Thực hành thuộc tính flex-flow trong CSS Flexbox</h1>

    <h2>Ví dụ 1: flex-flow: row nowrap (Mặc định: trái qua phải, không xuống dòng)</h2>
    <div class="container-1">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

    <h2>Ví dụ 2: flex-flow: row-reverse nowrap (Ngược lại: phải qua trái, không xuống dòng)</h2>
    <div class="container-2">
        <div>1</div>
        <div>2</div>
        <div>3</div>
    </div>

</body>
</html>
