<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình đơn dọc thả xuống (Vertical Dropdown Menu)</title>
    <style>
        /* Đặt font chữ và căn lề cơ bản */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #menu ul, #menu li {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        #menu {
            width: 140px;
        }

        #menu li {
            list-style: none;
            position: relative;
            width: 100px;
            height: 30px;
            padding: 0 20px;
            background-color: black;
            line-height: 30px;
            cursor: pointer;
            margin-bottom: 2px;
        }

        #menu a {
            text-decoration: none;
            color: white;
            display: block;
        }

        /* Hiệu ứng đổi màu nền khi rê chuột vào mục menu */
        #menu li:hover {
            background-color: #444444;
        }

        /* Định dạng cho danh sách con (dropdown) ẩn mặc định */
        #menu ul {
            position: absolute;
            top: 0;
            left: 140px;
            visibility: hidden;
        }

        /* Hiển thị danh sách con khi di chuột vào phần tử cha */
        #menu li:hover > ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- Khung chứa menu dọc -->
    <div id="menu">
        <ul>
            <li>
                <a href="#">Trang chủ</a>
            </li>
            <li>
                <a href="#">Sản phẩm</a>
                <ul>
                    <li><a href="#">Laptop</a></li>
                    <li><a href="#">Điện thoại</a></li>
                    <li><a href="#">Máy tính bảng</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Dịch vụ</a>
                <ul>
                    <li><a href="#">Thiết kế Web</a></li>
                    <li><a href="#">Lập trình App</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Liên hệ</a>
            </li>
        </ul>
    </div>

</body>
</html>
