<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h1 {
            color: #2c3e50;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 10px 15px;
            text-align: left;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Dell Inspiron</td>
                <td>18,500,000 đ</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Điện thoại iPhone 15</td>
                <td>22,900,000 đ</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Tai nghe Bluetooth Sony</td>
                <td>2,400,000 đ</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Gaming</td>
                <td>1,200,000 đ</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
