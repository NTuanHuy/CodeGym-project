<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 1 - Form Đơn Giản</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }
        form {
            background-color: #ffffff;
            max-width: 500px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .checkbox-group label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
        }
        .button-group {
            text-align: center;
            margin-top: 20px;
        }
        input[type="submit"] {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="reset"] {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <form method="post" action="#">
        <h2>SỞ THÍCH CỦA BẠN</h2>

        <div class="form-group">
            <label for="yourname">Họ và tên:</label>
            <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Nhập email..." required>
        </div>

        <div class="form-group checkbox-group">
            <label>Sở thích:</label><br>
            <input type="checkbox" id="sports" name="hobby" value="sports">
            <label for="sports">Thể thao</label>
            
            <input type="checkbox" id="music" name="hobby" value="music">
            <label for="music">Âm nhạc</label>
            
            <input type="checkbox" id="reading" name="hobby" value="reading">
            <label for="reading">Đọc sách</label>
            
            <input type="checkbox" id="travel" name="hobby" value="travel">
            <label for="travel">Du lịch</label>
        </div>

        <div class="button-group">
            <input type="submit" value="Gửi thông tin">
            <input type="reset" value="Nhập lại">
        </div>
    </form>

</body>
</html>
