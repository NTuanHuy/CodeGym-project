<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 2 - Đăng Ký Học Viên</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef2f5;
            padding: 30px;
        }
        form {
            background-color: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            border-top: 5px solid #2980b9;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2980b9;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label.title {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #2c3e50;
        }
        input[type="text"], input[type="email"], input[type="tel"], input[type="date"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .radio-group label, .checkbox-group label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
            cursor: pointer;
        }
        .button-group {
            text-align: center;
            margin-top: 25px;
        }
        button[type="submit"] {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button[type="reset"] {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-left: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <form method="post" action="#">
        <h2>ĐĂNG KÝ HỌC VIÊN</h2>

        <!-- Họ và tên -->
        <div class="form-group">
            <label class="title" for="fullname">Họ và tên:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Nhập đầy đủ họ và tên..." required>
        </div>

        <!-- Email -->
        <div class="form-group">
            <label class="title" for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="nguyenvana@gmail.com" required>
        </div>

        <!-- Số điện thoại -->
        <div class="form-group">
            <label class="title" for="phone">Số điện thoại:</label>
            <input type="tel" id="phone" name="phone" placeholder="0987654321" required>
        </div>

        <!-- Ngày sinh -->
        <div class="form-group">
            <label class="title" for="birthday">Ngày sinh:</label>
            <input type="date" id="birthday" name="birthday" required>
        </div>

        <!-- Giới tính -->
        <div class="form-group radio-group">
            <label class="title">Giới tính:</label>
            <input type="radio" id="male" name="gender" value="male" checked>
            <label for="male">Nam</label>
            
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Nữ</label>
            
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Khác</label>
        </div>

        <!-- Địa chỉ -->
        <div class="form-group">
            <label class="title" for="address">Địa chỉ:</label>
            <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ cư trú..."></textarea>
        </div>

        <!-- Khóa học -->
        <div class="form-group">
            <label class="title" for="course">Khóa học:</label>
            <select id="course" name="course">
                <option value="html_css">HTML & CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="java">Java</option>
                <option value="python">Python</option>
            </select>
        </div>

        <!-- Hình thức học -->
        <div class="form-group radio-group">
            <label class="title">Hình thức học:</label>
            <input type="radio" id="online" name="study_type" value="online" checked>
            <label for="online">Online</label>
            
            <input type="radio" id="offline" name="study_type" value="offline">
            <label for="offline">Offline</label>
        </div>

        <!-- Sở thích -->
        <div class="form-group checkbox-group">
            <label class="title">Sở thích:</label>
            <input type="checkbox" id="coding" name="hobby" value="coding">
            <label for="coding">Lập trình</label>

            <input type="checkbox" id="sports" name="hobby" value="sports">
            <label for="sports">Thể thao</label>

            <input type="checkbox" id="reading" name="hobby" value="reading">
            <label for="reading">Đọc sách</label>
        </div>

        <!-- Ghi chú -->
        <div class="form-group">
            <label class="title" for="note">Ghi chú:</label>
            <textarea id="note" name="note" rows="3" placeholder="Ghi chú thêm (nếu có)..."></textarea>
        </div>

        <!-- Nút Submit / Reset -->
        <div class="button-group">
            <button type="submit">Đăng ký</button>
            <button type="reset">Nhập lại</button>
        </div>
    </form>

</body>
</html>
