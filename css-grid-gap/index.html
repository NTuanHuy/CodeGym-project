<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Grid Gap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h2 {
            color: #333;
            margin-top: 30px;
        }

        .grid-container {
            display: grid;
            background-color: #ffffff;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .grid-container div {
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Ví dụ 1: Khoảng cách giữa hàng và cột bằng nhau (grid-gap: 20px) */
        .grid-ex1 {
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 20px; /* Tương đương gap: 20px */
        }
        .grid-ex1 div {
            background-color: lightblue;
        }

        /* Ví dụ 2: Khoảng cách hàng và cột khác nhau (grid-gap: 30px 10px) */
        .grid-ex2 {
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 30px 10px; /* Tương đương gap: 30px 10px */
        }
        .grid-ex2 div {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>Thực hành thuộc tính grid-gap</h1>

    <h2>Ví dụ 1: Thiết lập khoảng cách hàng và cột bằng nhau (grid-gap: 20px)</h2>
    <div class="grid-container grid-ex1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <h2>Ví dụ 2: Thiết lập khoảng cách hàng và cột khác nhau (grid-gap: 30px 10px)</h2>
    <div class="grid-container grid-ex2">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

</body>
</html>
