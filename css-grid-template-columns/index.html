<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Grid Template Columns</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h2 {
            color: #333;
            margin-top: 30px;
        }

        /* Ví dụ 1: 3 cột kích thước bằng nhau */
        .grid-container-1 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 30px;
        }

        .grid-container-1 div {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Ví dụ 2: Các cột kích thước khác nhau */
        .grid-container-2 {
            display: grid;
            grid-template-columns: 100px 200px 1fr;
            gap: 10px;
        }

        .grid-container-2 div {
            background-color: lightgreen;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Thực hành thuộc tính grid-template-columns</h1>

    <h2>Ví dụ 1: Tạo 3 cột có kích thước bằng nhau (1fr 1fr 1fr)</h2>
    <div class="grid-container-1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

    <h2>Ví dụ 2: Tạo các cột có kích thước khác nhau (100px 200px 1fr)</h2>
    <div class="grid-container-2">
        <div>Cột 1 (100px)</div>
        <div>Cột 2 (200px)</div>
        <div>Cột 3 (1fr)</div>
        <div>Cột 1</div>
        <div>Cột 2</div>
        <div>Cột 3</div>
    </div>

</body>
</html>
