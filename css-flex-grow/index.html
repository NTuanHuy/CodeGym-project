<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flex-Grow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .container {
            display: flex;
            gap: 10px;
            background-color: #ffffff;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 800px;
        }

        .item {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
            flex-grow: 0; /* Mặc định các item không tự phình to */
        }

        /* Áp dụng flex-grow cho item thứ 2 */
        .item2 {
            flex-grow: 2;
            background-color: lightcoral;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Thực hành thuộc tính flex-grow với 5 Flex Item</h1>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item item2">Item 2 (flex-grow: 2)</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>

</body>
</html>
